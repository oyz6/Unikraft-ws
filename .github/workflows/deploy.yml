name: 自动部署代理到 Unikraft Cloud

on:
  workflow_dispatch:
    inputs:
      METRO:
        description: 'Metro 区域'
        required: true
        default: '德国 法兰克福 (fra)'
        type: choice
        options:
          - 德国 法兰克福 (fra)
          - 美国 达拉斯 (dal)
          - 美国 圣何塞 (sfo)
          - 新加坡 (sin)
          - 美国 华盛顿 (was)
      app_name:
        description: '应用名称（留空自动生成）'
        required: false
        default: ''
      UUID:
        description: 'UUID（留空用默认值）'
        required: false
        default: ''
      SUB_PATH:
        description: 'SUB_PATH（留空使用 sub）'
        required: false
        default: ''
      MEMORY:
        description: '内存 MB'
        required: false
        default: '512'
      ENABLE_NEZHA:
        description: '是否启用哪吒 Agent'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      NEZHA_SERVER:
        description: 'NEZHA_SERVER（仅 ENABLE_NEZHA=true 时使用）'
        required: false
        default: ''
      NEZHA_KEY:
        description: 'NEZHA_KEY（须和 NEZHA_SERVER 一起填）'
        required: false
        default: ''

env:
  DEFAULT_METRO: fra
  DEFAULT_MEMORY: 512
  INTERNAL_PORT: 3000

jobs:
  deploy-app:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 安装 Unikraft CLI
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://unikraft.com/cli/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.unikraft/bin" >> $GITHUB_PATH

      - name: 安装 Docker（BuildKit）
        uses: docker/setup-buildx-action@v3

      - name: 安装 jq 和 curl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq curl

      - name: 生成 app 名称和变量
        run: |
          RANDOM_STR=$(head /dev/urandom | tr -dc 'a-z' | head -c 8)
          APP_NAME="$RANDOM_STR"
          if [ -n "${{ github.event.inputs.app_name }}" ]; then
            APP_NAME="${{ github.event.inputs.app_name }}"
          fi
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"

          case "${{ github.event.inputs.METRO }}" in
            "德国 法兰克福 (fra)") METRO="fra" ;;
            "美国 达拉斯 (dal)")   METRO="dal" ;;
            "美国 圣何塞 (sfo)")   METRO="sfo" ;;
            "新加坡 (sin)")        METRO="sin" ;;
            "美国 华盛顿 (was)")   METRO="was" ;;
            *)                     METRO="${{ env.DEFAULT_METRO }}" ;;
          esac
          echo "METRO=$METRO" >> "$GITHUB_ENV"

          MEMORY="${{ github.event.inputs.MEMORY }}"
          [ -z "$MEMORY" ] && MEMORY="${{ env.DEFAULT_MEMORY }}"
          echo "MEMORY=$MEMORY" >> "$GITHUB_ENV"

          echo "应用名称: $APP_NAME"
          echo "Metro: $METRO"
          echo "内存: ${MEMORY}M"

      - name: 登录 Unikraft Cloud 并获取组织名
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
        run: |
          echo "$UKC_TOKEN" > /tmp/ukc-token
          chmod 600 /tmp/ukc-token
          LOGIN_OUTPUT=$(unikraft login --token /tmp/ukc-token 2>&1)
          echo "$LOGIN_OUTPUT"
          ORG=$(echo "$LOGIN_OUTPUT" \
            | sed 's/\x1b\[[0-9;]*m//g' \
            | grep -oP 'organization=\K[^ ]+' | head -n 1 | tr -d '[:space:]')
          [ -z "$ORG" ] && ORG="oyz"
          echo "当前组织: [$ORG]"
          echo "ORG=$ORG" >> "$GITHUB_ENV"

      - name: 验证登录状态
        run: unikraft metro list

      - name: 构建镜像
        run: |
          IMAGE="unikraft.io/${{ env.ORG }}/${{ env.APP_NAME }}:latest"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          unikraft build . --output "$IMAGE"

      - name: 通过 On-Demand Template 部署
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
          UUID_VAL: ${{ github.event.inputs.UUID }}
          SUB_PATH_VAL: ${{ github.event.inputs.SUB_PATH }}
          NEZHA_SERVER_VAL: ${{ github.event.inputs.NEZHA_SERVER }}
          NEZHA_KEY_VAL: ${{ github.event.inputs.NEZHA_KEY }}
        run: |
          set -euo pipefail

          UUID_INPUT="${UUID_VAL:-${{ secrets.UUID }}}"
          SUB_PATH_INPUT="${SUB_PATH_VAL:-${{ secrets.SUB_PATH }}}"
          NZ_SERVER_INPUT="${NEZHA_SERVER_VAL:-${{ secrets.NEZHA_SERVER }}}"
          NZ_KEY_INPUT="${NEZHA_KEY_VAL:-${{ secrets.NEZHA_KEY }}}"
          ENABLE_NEZHA_VAL="${{ github.event.inputs.ENABLE_NEZHA }}"

          [ -z "$UUID_INPUT" ] && UUID_INPUT="c202b33e-03d9-406c-9bba-1ca228036028"
          [ -z "$SUB_PATH_INPUT" ] && SUB_PATH_INPUT="sub"
          [ -z "$ENABLE_NEZHA_VAL" ] && ENABLE_NEZHA_VAL="false"
          WSPATH_VAL="${UUID_INPUT:0:8}"

          echo "UUID=$UUID_INPUT" >> "$GITHUB_ENV"
          echo "WSPATH=$WSPATH_VAL" >> "$GITHUB_ENV"
          echo "SUB_PATH=$SUB_PATH_INPUT" >> "$GITHUB_ENV"
          echo "ENABLE_NEZHA_VAL=$ENABLE_NEZHA_VAL" >> "$GITHUB_ENV"

          API_BASE="https://api.${{ env.METRO }}.unikraft.cloud/v1"
          TEMPLATE_NAME="${{ env.APP_NAME }}-tpl"

          # 清理同名实例和旧模板
          echo "=== 清理旧实例 ==="
          curl -sS -X DELETE \
            -H "Authorization: Bearer $UKC_TOKEN" \
            "$API_BASE/instances/${{ env.APP_NAME }}" || true

          echo ""
          echo "=== 清理旧模板 ==="
          curl -sS -X DELETE \
            -H "Authorization: Bearer $UKC_TOKEN" \
            "$API_BASE/instances/templates/${TEMPLATE_NAME}" || true

          echo ""
          echo "=== 构造 Deploy JSON ==="
          # 所有环境变量都放在 create_args.env（快照会锁定它们）
          jq -n \
            --arg name "${{ env.APP_NAME }}" \
            --arg tpl "$TEMPLATE_NAME" \
            --arg image "${{ env.IMAGE }}" \
            --argjson memory "${{ env.MEMORY }}" \
            --arg port "${{ env.INTERNAL_PORT }}" \
            --arg uuid "$UUID_INPUT" \
            --arg wspath "$WSPATH_VAL" \
            --arg subpath "$SUB_PATH_INPUT" \
            --arg enable_nezha "$ENABLE_NEZHA_VAL" \
            --arg nz_server "$NZ_SERVER_INPUT" \
            --arg nz_key "$NZ_KEY_INPUT" \
            '{
              name: $name,
              template: {
                name: $tpl,
                prepare: true,
                create_args: {
                  image: $image,
                  memory_mb: $memory,
                  vcpus: 1,
                  env: ({
                    PORT: $port,
                    UUID: $uuid,
                    WSPATH: $wspath,
                    SUB_PATH: $subpath,
                    NAME: "ukc",
                    ENABLE_NEZHA: $enable_nezha
                  } + (if $enable_nezha == "true" and $nz_server != "" and $nz_key != ""
                       then {
                         NZ_SERVER: $nz_server,
                         NZ_CLIENT_SECRET: $nz_key,
                         NZ_UUID: $uuid
                       }
                       else {} end))
                }
              },
              service_group: {
                services: [{
                  port: 443,
                  destination_port: ($port | tonumber),
                  handlers: ["tls", "http"]
                }]
              },
              autostart: true
            }' > /tmp/deploy.json

          cat /tmp/deploy.json

          echo ""
          echo "=== 调用 API 创建实例（On-Demand Template） ==="
          curl -sS -X POST \
            -H "Authorization: Bearer $UKC_TOKEN" \
            -H "Content-Type: application/json" \
            -d @/tmp/deploy.json \
            "$API_BASE/instances" \
            -w "\nHTTP_CODE=%{http_code}\n"

      - name: 获取实例信息
        env:
          UKC_TOKEN: ${{ secrets.UKC_TOKEN }}
        run: |
          sleep 20
          echo "=== 实例列表 ==="
          unikraft instance list
          echo ""
          echo "=== 实例详情 ==="
          unikraft instance get ${{ env.APP_NAME }} || true

          API_BASE="https://api.${{ env.METRO }}.unikraft.cloud/v1"
          FQDN=$(curl -sS \
            -H "Authorization: Bearer $UKC_TOKEN" \
            "$API_BASE/instances/${{ env.APP_NAME }}" 2>/dev/null \
            | jq -r '.data.instances[0].service_group.domains[0].fqdn // empty')

          if [ -z "$FQDN" ]; then
            FQDN=$(unikraft instance list 2>/dev/null | grep "${{ env.APP_NAME }}" \
              | grep -oE '[a-z0-9-]+\.'${{ env.METRO }}'\.unikraft\.app' | head -1)
          fi
          echo "FQDN=$FQDN" >> "$GITHUB_ENV"
          echo "访问域名: $FQDN"

      - name: 详细部署信息
        run: |
          echo "🚀 部署完成！"
          echo "Metro: ${{ env.METRO }}"
          echo "应用名称: ${{ env.APP_NAME }}"
          echo "组织: ${{ env.ORG }}"
          echo "模板名称: ${{ env.APP_NAME }}-tpl"
          echo "内存: ${{ env.MEMORY }}M"
          echo "UUID: ${{ env.UUID }}"
          echo "WSPATH: ${{ env.WSPATH }}"
          echo "订阅路径: ${{ env.SUB_PATH }}"
          echo "启用哪吒: ${{ env.ENABLE_NEZHA_VAL }}"
          echo ""
          if [ -n "${FQDN:-}" ]; then
            echo "主页: https://$FQDN/"
            echo "订阅: https://$FQDN/${{ env.SUB_PATH }}"
            echo ""
            echo "VLESS: vless://${{ env.UUID }}@$FQDN:443?encryption=none&security=tls&sni=$FQDN&fp=chrome&type=ws&host=$FQDN&path=%2F${{ env.WSPATH }}"
          else
            echo "⚠️ 未获取到 FQDN，请手动查看实例详情"
          fi

      - name: 清理临时文件
        if: always()
        run: rm -f /tmp/ukc-token /tmp/deploy.json

      - name: 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
